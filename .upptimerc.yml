# HostInRegola uptime + status — Upptime (https://upptime.js.org)
# Watches the LIVE app from outside our own infrastructure; a failed check auto-opens a GitHub
# issue assigned below. No server, no cost: GitHub Actions + Issues + Pages only.
owner: rokcebron-cpu
repo: hostinregola-status

# Public checks need no contextual secrets; GH_PAT is supplied separately.
secrets: []

sites:
  - name: App — database and login service
    url: https://hostinregola.vercel.app/api/health/ready
    expectedStatusCodes:
      - 200
  - name: App — login
    url: https://hostinregola.vercel.app/login
  - name: App — root
    url: https://hostinregola.vercel.app
  - name: Cron endpoint auth guard (401 atteso)
    # The scheduled-jobs endpoint must EXIST and must REFUSE unauthenticated calls — a 401 here is
    # the healthy state (proves both reachability and the bearer guard in one check).
    url: https://hostinregola.vercel.app/api/cron/tick
    expectedStatusCodes:
      - 401

assignees:
  - rokcebron-cpu

status-website:
  # No custom domain — served from GitHub Pages under the repo path.
  baseUrl: /hostinregola-status
  name: HostInRegola — stato del servizio
  introTitle: "Stato del servizio **HostInRegola**"
  introMessage: Controlli automatici programmati ogni 5 minuti. GitHub può ritardarne l’esecuzione. Ultimi risultati e cronologia qui sotto.
  navbar:
    - title: Stato
      href: /hostinregola-status/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
